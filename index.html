<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد الشهادات الاحترافية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- لوحة إدخال البيانات -->
    <div class="form-section no-print">
      <h2>إدخال بيانات الشهادة</h2>
      <form id="cert-form">
        <label>اسم المتدرب:</label>
        <input type="text" id="nameInput" placeholder="مثال: أحمد محمد علي" required>

        <label>اسم الدورة التدريبية:</label>
        <input type="text" id="courseInput" placeholder="مثال: تطوير تطبيقات الويب الكاملة" required>

        <label>تاريخ الإصدار:</label>
        <input type="date" id="dateInput" required>

        <label>الجهة المصدرة / اسم المدرب:</label>
        <input type="text" id="issuerInput" placeholder="مثال: أكاديمية التقنية" required>

        <button type="button" class="print-btn" onclick="window.print()">طباعة / حفظ كـ PDF</button>
      </form>
    </div>

    <!-- قالب الشهادة -->
    <div class="cert-wrapper">
      <div class="certificate" id="certificate">
        <div class="cert-border">
          <div class="cert-header">
            <h1>شهادة إتمام</h1>
            <p class="subtitle">CERTIFICATE OF COMPLETION</p>
          </div>
          
          <div class="cert-body">
            <p>تشهد الجهة المختصة بأن السيد/السيدة:</p>
            <h2 id="certName">اسم المتدرب هنا</h2>
            <p>قد اجتاز بنجاح ومتطلبات الدورة التدريبية بعنوان:</p>
            <h3 id="certCourse">عنوان الدورة التدريبية</h3>
          </div>

          <div class="cert-footer">
            <div class="footer-item">
              <p><strong>التاريخ:</strong> <span id="certDate">2026/08/12</span></p>
            </div>
            <div class="footer-item">
              <p><strong>الاعتماد:</strong> <span id="certIssuer">اسم الجهة</span></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
